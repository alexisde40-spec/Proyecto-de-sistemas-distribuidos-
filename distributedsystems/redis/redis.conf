bind 0.0.0.0
port 6379
protected-mode no
daemonize no

# Persistence: data survives failures (AOF + RDB snapshots)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Memory policy: cache entries are evictable; keyspace notifications off
maxmemory-policy allkeys-lru
maxmemory 256mb

# Replication (master by default; replica sets masterof via command)
repl-diskless-sync no
